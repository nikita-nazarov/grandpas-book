<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Содержание — Мемуары</title>
  <link rel="stylesheet" href="tufte.css">
  <style>
    .subtitle { margin-top: 0; color: #888; font-style: italic; }
    .toc-list { padding-left: 1.4rem; margin-top: 3rem; line-height: 2; }
    .toc-list li { font-size: 1.1rem; }
    .toc-list a { color: #111; text-decoration: none; border-bottom: 1px solid #ccc; }
    .toc-list a:hover { border-bottom-color: #111; }
    @media (prefers-color-scheme: dark) {
      .toc-list a { color: #ddd; border-bottom-color: #555; }
      .toc-list a:hover { border-bottom-color: #ddd; }
    }
  </style>
</head>
<body>
<article>
  <h1>Мемуары</h1>
  <p class="subtitle">Ковалевский Владимир Михайлович</p>
  <ol class="toc-list">
    ${items}
  </ol>
</article>
</body>
</html>
